<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Sinema Modu — Ayarlar</title>
  <style>
    :root {
      --zemin: #17130c;
      --panel: #201b12;
      --metin: #e9e3d8;
      --soluk: rgb(233 227 216 / .6);
      --vurgu: #f0b45c;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 320px; padding: 18px;
      background: var(--zemin); color: var(--metin);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      font-size: 14px; font-weight: 600; letter-spacing: .02em;
      display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
    }
    h1 img { width: 20px; height: 20px; }
    .alan { margin-bottom: 16px; }
    .ust { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .ust label { color: var(--metin); font-weight: 500; }
    .ust output { color: var(--vurgu); font: 600 12px ui-monospace, Menlo, Consolas, monospace; }
    input[type="range"] {
      width: 100%; accent-color: var(--vurgu); cursor: pointer;
    }
    .not { color: var(--soluk); font-size: 11px; margin-top: 4px; }
    .alt {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 18px; padding-top: 14px;
      border-top: 1px solid rgb(255 255 255 / .08);
    }
    button {
      all: unset; cursor: pointer;
      padding: 6px 12px; border-radius: 6px;
      background: rgb(255 255 255 / .07); color: var(--metin);
      font-size: 12px; transition: background-color .12s ease;
    }
    button:hover { background: rgb(255 255 255 / .14); }
    button:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 1px; }
    .kayit { color: var(--soluk); font-size: 11px; opacity: 0; transition: opacity .2s ease; }
    .kayit.goster { opacity: 1; }
  </style>
</head>
<body>
  <h1><img src="icons/icon32.png" alt="">Sinema Modu</h1>

  <div class="alan">
    <div class="ust">
      <label for="dim">Karartma koyuluğu</label>
      <output id="dimVal">0.88</output>
    </div>
    <input type="range" id="dim" min="0.10" max="0.97" step="0.01" value="0.88">
    <div class="not">Odak modundayken sayfanın geri kalanının ne kadar karanlık olacağı. Sayfa içinde Q / E ile de değişir.</div>
  </div>

  <div class="alan">
    <div class="ust">
      <label for="pad">Nefes payı</label>
      <output id="padVal">14 px</output>
    </div>
    <input type="range" id="pad" min="0" max="80" step="2" value="14">
    <div class="not">Seçilen alanın etrafında bırakılan boşluk. Sayfa içinde , / . tuşlarıyla da değişir.</div>
  </div>

  <div class="alt">
    <span class="kayit" id="kayit">Kaydedildi</span>
    <button id="sifirla">Varsayılanlara dön</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
